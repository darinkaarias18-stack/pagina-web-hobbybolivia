    <rect x="95" y="215" width="24" height="12" rx="2"/>
    <rect x="130" y="205" width="24" height="12" rx="2"/>
    <rect x="245" y="205" width="12" height="24" rx="2"/>
    <rect x="270" y="210" width="24" height="12" rx="2"/>
    <rect x="310" y="205" width="20" height="24" rx="2"/>

    <rect x="70" y="240" width="24" height="12" rx="2"/>
    <rect x="110" y="235" width="12" height="12" rx="2"/>
    <rect x="140" y="230" width="12" height="24" rx="2"/>
    <rect x="250" y="240" width="30" height="12" rx="2"/>
