    <rect x="180" y="265" width="12" height="24" rx="2"/>
    <rect x="210" y="270" width="24" height="12" rx="2"/>
    <rect x="250" y="265" width="12" height="12" rx="2"/>
    <rect x="280" y="265" width="20" height="24" rx="2"/>
    <rect x="315" y="270" width="15" height="12" rx="2"/>

